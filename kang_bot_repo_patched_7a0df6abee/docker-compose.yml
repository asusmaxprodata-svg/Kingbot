version: "3.9"
services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LOG_JSON=1
      - METRICS_PORT=9100
      - HEARTBEAT_PATH=/app/logs/heartbeat.txt
    command: ["python","-m","kingbot","--mode","live"]
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD","python","ops/scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 5

  ui:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["streamlit","run","streamlit_main.py","--server.port=8501","--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      bot:
        condition: service_healthy
